<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kai Konane</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <script src="{{ url_for('static', filename='js/sounds.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Welcome page DOM content loaded');
            const signupButton = document.getElementById('signupButton');
            const loginButton = document.getElementById('loginButton');

            signupButton.addEventListener('click', function() {
                console.log('Signup button clicked');
                playSound('click').then(() => {
                    window.location.href = '{{ url_for('user.signup') }}';
                });
            });

            loginButton.addEventListener('click', function() {
                console.log('Login button clicked');
                playSound('click').then(() => {
                    window.location.href = '{{ url_for('user.login') }}';
                });
            });
        });
    </script>
</head>
<body>
    {% include '_flashes.html' %}


    <style>
        .content {
            background-image:
                linear-gradient(rgba(15, 46, 74, 0.35), rgba(15, 46, 74, 0.55)),
                url('/static/background_pictures/index_page.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 62vh;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.94);
            border-radius: 26px;
            padding: 42px 48px;
            max-width: 560px;
            box-shadow: 0 14px 40px rgba(15, 46, 74, 0.35);
        }

        .hero-card img { width: 96px; height: 96px; margin-bottom: 6px; }

        .hero-card h1 { margin-bottom: 8px; }

        .hero-tagline {
            color: #5B7185;
            font-size: 1.12rem;
            margin: 0 0 26px;
        }

        .hero-card .button, .hero-card .login-btn {
            font-size: 1.15rem;
            padding: 14px 38px;
        }
    </style>

    <div class="header"></div>
    <div class="content">
        <div class="hero-card">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Kai Konane logo">
            <h1>Welcome to Kai Konane</h1>
            <p class="hero-tagline">Stories, games and STEM adventures for little learners.</p>
            <div class="button-container">
                <button id="loginButton" class="login-btn">Log in</button>
                <button id="signupButton" class="button">Sign up</button>
            </div>
        </div>
    </div>
    <div class="footer"></div>
</body>
</html>
