{{- if ne .Values.secrets.mode "existing" }}
{{/*
Generated credentials.

randAlphaNum runs on every render, so a plain `helm upgrade` would mint new
keys and invalidate every session and issued token. `lookup` reads the Secret
already in the cluster and reuses its values, so generation happens once, on
first install.

Known limitation: lookup returns nothing during `helm template` and --dry-run,
so a rendered manifest shows different values than an applied one. Acceptable
on a laptop; secrets.mode=existing is the answer anywhere else.

See deploy/README.md note 8: base64 is encoding, not encryption.
*/}}
{{- $name := printf "%s-secrets" (include "kai.fullname" .) }}
{{- $found := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $pg := "" }}{{- $sk := "" }}{{- $wsk := "" }}{{- $ats := "" }}
{{- if $found }}
{{- $pg  = index $found.data "POSTGRES_PASSWORD" | b64dec }}
{{- $sk  = index $found.data "SECRET_KEY"        | b64dec }}
{{- $wsk = index $found.data "WEB_SECRET_KEY"    | b64dec }}
{{- $ats = index $found.data "API_TOKEN_SECRET"  | b64dec }}
{{- else }}
{{- $pg  = randAlphaNum 32 }}
{{- $sk  = randAlphaNum 64 }}
{{- $wsk = randAlphaNum 64 }}
{{- $ats = randAlphaNum 64 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kai.labels" . | nindent 4 }}
  annotations:
    # Created as a pre-install hook at a lower weight than the migration, so
    # the Secret and the database exist before anything tries to use them.
    # Without this the migration hook runs first and fails on a missing Secret.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    # Kept, not deleted: hook resources are normally cleaned up, and deleting
    # the database on every upgrade would be memorable for the wrong reasons.
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pg | quote }}
  SECRET_KEY: {{ $sk | quote }}
  WEB_SECRET_KEY: {{ $wsk | quote }}
  {{/* Deliberately a different value from SECRET_KEY: two trust boundaries. */}}
  API_TOKEN_SECRET: {{ $ats | quote }}
  {{/* Known, so `flask seed` never strands you -- README note 7. */}}
  ADMIN_PASSWORD: {{ .Values.secrets.demoPassword | quote }}
  DEMO_PASSWORD: {{ .Values.secrets.demoPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s"
      (.Values.postgres.enabled | ternary .Values.postgres.username .Values.externalDatabase.username)
      $pg
      (include "kai.databaseHost" .)
      (.Values.postgres.enabled | ternary .Values.postgres.database .Values.externalDatabase.database)
      | quote }}
{{- end }}