{{- if .Values.postgres.enabled }}
{{/* StatefulSet, not Deployment; headless Service; volumeClaimTemplates.
     All three reasons are in deploy/README.md. */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kai.fullname" . }}-postgres
  labels:
    {{- include "kai.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  annotations:
    # Created as a pre-install hook at a lower weight than the migration, so
    # the Secret and the database exist before anything tries to use them.
    # Without this the migration hook runs first and fails on a missing Secret.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
spec:
  serviceName: {{ include "kai.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "kai.componentSelector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kai.componentLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "kai.secretName" . }}, key: POSTGRES_PASSWORD }
            {{/* A subdirectory: a mounted volume arrives with lost+found and
                 Postgres refuses to initialise a non-empty directory. */}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          {{/* pg_isready, not TCP -- Postgres accepts connections while
               replaying WAL and rejects every query. */}}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run,  mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}