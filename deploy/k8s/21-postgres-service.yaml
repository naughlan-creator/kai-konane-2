apiVersion: v1
kind: Service
metadata:
  name: kai-postgres
  namespace: kai-konane
  labels:
    app.kubernetes.io/name: kai-konane
    app.kubernetes.io/component: postgres
spec:
  # Headless: no Cluster IP, no load balancing. DNS returns the pod addresses
  # directly, which is what gives the database a stable name.

  # A normal Service load-balances across endpoints. With one replica that
  # looks identical -- and with two it means connections landing on whichever
  # postgres the proxy picked, which is data corruption. Invisible until it isnt
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: kai-konane
    app.kubernetes.io/component: postgres