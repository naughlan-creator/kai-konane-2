apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kai-postgres
  namespace: kai-konane
  labels:
    app.kubernetes.io/name: kai-konane
    app.kubernetes.io/component: postgres
spec:
  # Points at the headless Service below. This is what gives each pod its
  # stable DNS name (kai-postgres-0.kai-postgres).
  serviceName: kai-postgres
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: kai-konane
      app.kubernetes.io/component: postgres

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kai-konane
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The postgres alpine image runs as uid 70. fsGroup makes the mounted
        # volume writable by that user -- without it the pod starts and
        # immediately fails on a permission error in the data directory.
        runAsUser: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: kai_konane
            - name: POSTGRES_USER
              value: kai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kai-secrets
                  key: POSTGRES_PASSWORD

            # PGDATA points at a SUBDIRECTORY of the mount, not the mount root.
            #
            # A mounted volume on Linux arrives containing lost+found, and
            # Postgres refuses to initialise a directory that is not empty.
            # The error reads as a stale volume rather than a first-run
            # problem, and people wipe the PVC trying to fix it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # pg_isready, not a TCP check.
          #
          # Postgres accepts connections on 5432 while it is still replaying
          # WAL, and rejects every query with "the database system is starting
          # up". A TCP probe reports ready for a server that answers nothing --
          # the api then starts, fails its first query, and crash-loops behind
          # a database that is merely slow.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kai", "-d", "kai_konane"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kai", "-d", "kai_konane"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Postgres writes its socket and lock files here.
            - name: run
              mountPath: /var/run/postgresql

      volumes:
        - name: run
          emptyDir: {}

  # volumeClaimTemplates, not a volume

  # This is what makes the data survive the pod being deleted -- each pod gets
  # its own claim. It also, deliberately, survives 'kubectl delete statefulset':
  # Kubernetes does not garbage collect these claims. Deleting the data is then
  # an explicit 'kubectl delete pvc', which is the right amount of friction
  # between a person and a database
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: kind's default (local-path) is used.
        resources:
          requests:
            storage: 2Gi
