apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# Prometheus discovers scrape targets by ASKING the Kubernetes API what pods
# exist. That is the whole difference from a static compose config: targets
# are not listed anywhere, they are found. A pod that scales from 2 to 6 is
# scraped six times without anyone editing a file.
#
# The cost is that Prometheus needs read access to the cluster. Read-only, and
# only to the three things service discovery uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring