apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasources.yaml: |
    # The datasource is configuration, not a thing you click.
    #
    # A hand-configured datasource lives only in Grafana's own database, so a
    # rebuilt Grafana is a Grafana with no data and no record of where the
    # data was.
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: kai-konane
        orgId: 1
        folder: ''
        type: file
        # Dashboards are code. UI edits are not persisted, which is the point:
        # the alternative is a dashboard whose definitive version is whatever
        # someone last dragged around at 2am, recoverable only from a backup.
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards