apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472       # the grafana user in the upstream image
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.5.1
          ports:
            - name: http
              containerPort: 3000
          env:
            # Local only. A real deployment reads this from a Secret, and
            # would disable the admin account in favour of SSO.
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "kaidemo123"
            # Nothing here should reach the internet.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: provisioning-ds, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-db, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards,      mountPath: /var/lib/grafana/dashboards }
            - { name: data,            mountPath: /var/lib/grafana }
      volumes:
        # The SAME ConfigMap mounted twice, with subPath picking one key each
        # time. Grafana requires datasources and dashboard providers in
        # separate directories, and mounting a whole ConfigMap into either one
        # would put both files in both places -- Grafana then fails to parse
        # a dashboard provider as a datasource.
        - name: provisioning-ds
          configMap:
            name: grafana-provisioning
            items: [{ key: datasources.yaml, path: datasources.yaml }]
        - name: provisioning-db
          configMap:
            name: grafana-provisioning
            items: [{ key: dashboards.yaml, path: dashboards.yaml }]
        - name: dashboards
          configMap:
            name: grafana-dashboard-kai
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: grafana