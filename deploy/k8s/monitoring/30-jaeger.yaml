apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            # In-memory storage, bounded. Traces are lost on restart, which is
            # correct here: this is a laptop and they are disposable. A real
            # deployment uses Cassandra, Elasticsearch or Tempo behind object
            # storage -- and trace retention becomes the same per-GB cost
            # decision as log retention.
            - name: MEMORY_MAX_TRACES
              value: "20000"
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: ui,        containerPort: 16686 }
          readinessProbe:
            httpGet: { path: /, port: ui }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: ui }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # No runAsNonRoot/runAsUser, unlike every other workload here. The
            # upstream image's uid varies between releases, and pinning the
            # wrong one produces a permission error at startup rather than a
            # clear refusal.
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
spec:
  type: ClusterIP
  ports:
    - { port: 4318,  targetPort: otlp-http, name: otlp-http }
    - { port: 4317,  targetPort: otlp-grpc, name: otlp-grpc }
    - { port: 16686, targetPort: ui,        name: ui }
  selector:
    app.kubernetes.io/name: jaeger