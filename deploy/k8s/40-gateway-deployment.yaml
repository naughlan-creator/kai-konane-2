apiVersion: apps/v1
kind: Deployment
metadata:
  name: kai-gateway
  namespace: kai-konane
  labels:
    app.kubernetes.io/name: kai-konane
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kai-konane
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kai-konane
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: kai-gateway:dev
          ports:
            - name: http
              containerPort: 80
          env:
            # Fully qualified, because nginx's resolver ignores the search
            # domains in /etc/resolv.conf. A short name works from wget and
            # curl inside the same pod and fails from nginx -- which is why
            # "I can reach it from the container" does not prove the gateway
            # can.
            - name: API_UPSTREAM
              value: "kai-api.kai-konane.svc.cluster.local:5000"
            - name: WEB_UPSTREAM
              value: "kai-web.kai-konane.svc.cluster.local:5000"

          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # Drop everything, then add back only what nginx actually needs.
              # This is the point of the capability model: "root" is not one
              # permission, it is about forty, and a process should hold only
              # the ones it uses.
              drop: ["ALL"]
              add:
                # nginx chowns /var/cache/nginx to uid 101 at startup. Root
                # without CAP_CHOWN cannot, and nginx exits [emerg].
                - CHOWN
                # The master spawns workers as the unprivileged nginx user.
                - SETUID
                - SETGID
                # Binding port 80 -- anything below 1024 needs this, even as
                # root, once ALL has been dropped.
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: false

          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run,   mountPath: /var/run }
            - { name: nginx-conf,  mountPath: /etc/nginx/conf.d }

      volumes:
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run,   emptyDir: {} }
        - { name: nginx-conf,  emptyDir: {} }

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kai-konane
              app.kubernetes.io/component: gateway