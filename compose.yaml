services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kai_konane
      POSTGRES_USER: kai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kai -d kai_konane"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  api:
    build: ./services/api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://kai:${POSTGRES_PASSWORD}@db:5432/kai_konane
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      API_TOKEN_SECRET: ${API_TOKEN_SECRET:?set API_TOKEN_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - media:/app/static/images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./services/web
    environment:
      APP_ENV: production
      SECRET_KEY: ${WEB_SECRET_KEY:?set WEB_SECRET_KEY in .env}
      API_BASE_URL: http://api:5000
      # Empty on purpose: the browser reaches the api through the gateway on the
      # same origin. Setting this to API_BASE_URL would put a Docker-internal
      # hostname into every <img src> and every fetch().
      API_PUBLIC_URL: ""
      API_TIMEOUT_S: "5"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  db_data:
  media: