# single public entrypoint... everything under /api goes to the api services
# everything else goes to web... neither service publishes a port of its own

upstream api_service {
    server api:5000;
}

upstream web_service {
    server web:5000;
}

server {
    listen 80;
    server_name _;

    # must match the api MAX_UPLOAD_MB... nginx defaults to 1 MB rejects 
    # anything bigger with a 413 before the request reaches the app
    # so a cover image upload would fail with an nginx error page while the api's
    # own 10 MB limit never got a say
    client_max_body_size 10m;

    # compress text on the way out... images and fonts are already compressed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api_service;

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web_service;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}