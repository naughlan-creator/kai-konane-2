<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ preschool.name }} - Kai Konane</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
    <script src="{{ url_for('static', filename='js/sounds.js') }}"></script>
    <style>
        .header, .footer {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .header {
            top: 0;
        }
        .footer {
            bottom: 0;
        }
        .content {
            background-image: url('/static/background_pictures/admin_page.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 60vh;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    {% include '_flashes.html' %}

    <div class="header">
        <h1 class="title">Hello Admin</h1>
        <button onclick="confirmLogout()" class="button logout-btn">Log Out</button>
    </div>

    <div class="content">
        <h2 style="color: white;">{{ preschool.name }}</h2>
        <div class="button-group">
            <button onclick="playAndNavigate('click', '{{ url_for('preschool.edit_preschool', preschool_id=preschool.id) }}')" class="login-btn">Edit Preschool</button>
            <button onclick="playAndNavigate('back', '{{ url_for('preschool.view_preschools') }}')" class="logout-btn">Back to List</button>
        </div>
    </div>

    <div class="footer"></div>

    <div class="volume-slider-container">
        <input type="range" min="0" max="100" value="100" class="volume-slider" id="volumeSlider" orient="vertical">
        <label for="volumeSlider" style="color: white;">Volume</label>
    </div>

    <script>
        let adminMusicSource = null;
        let adminMusicGainNode = null;

        function playAdminMusic() {
            if (adminMusicSource) {
                adminMusicSource.stop();
            }
            adminMusicSource = audioManager.context.createBufferSource();
            adminMusicSource.buffer = audioManager.sounds['adminMusic'];
            adminMusicGainNode = audioManager.context.createGain();
            adminMusicSource.connect(adminMusicGainNode);
            adminMusicGainNode.connect(audioManager.masterGainNode);
            adminMusicSource.loop = true;
            adminMusicSource.start(0);
        }

        function fadeOutAdminMusic(duration = 0.5) {
            return new Promise((resolve) => {
                if (adminMusicGainNode) {
                    const currentTime = audioManager.context.currentTime;
                    adminMusicGainNode.gain.setValueAtTime(adminMusicGainNode.gain.value, currentTime);
                    adminMusicGainNode.gain.linearRampToValueAtTime(0, currentTime + duration);
                    setTimeout(resolve, duration * 1000);
                } else {
                    resolve();
                }
            });
        }

        function playAndNavigate(soundId, url) {
            fadeOutAdminMusic().then(() => {
                playSound(soundId).then(() => {
                    window.location.href = url;
                });
            });
        }

        function confirmLogout() {
            // Ask first. Gating the dialog behind click.wav made the button feel
            // dead for over a second, and on a suspended AudioContext the sound
            // promise never settled so the dialog never opened at all.
            if (!confirm("Are you sure you want to log out?")) {
                return;
            }
            const logoutUrl = "{{ url_for('user.logout') }}";
            let leaving = false;
            const leave = function () {
                if (leaving) { return; }
                leaving = true;
                window.location.href = logoutUrl;
            };
            fadeOutAdminMusic();
            playSound('bye').then(leave);
            setTimeout(leave, 1000);   // audio must never strand the user
        }

        function initializeViewPreschoolPage() {
            playAdminMusic();

            // Initialize volume control
            const volumeSlider = document.getElementById('volumeSlider');
            volumeSlider.value = audioManager.getStoredVolume() * 100;
            volumeSlider.addEventListener('input', function() {
                const volume = this.value / 100;
                audioManager.setVolume(volume);
            });
        }

        // Wait for both DOM content and sounds to be loaded before initializing
        document.addEventListener('DOMContentLoaded', function() {
            if (window.audioManager.soundsLoaded) {
                initializeViewPreschoolPage();
            } else {
                document.addEventListener('soundsLoaded', initializeViewPreschoolPage);
            }
        });
    </script>
</body>
</html>
