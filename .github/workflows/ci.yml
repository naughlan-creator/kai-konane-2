# CI on GitHub Actions.
#
# Supersedes azure-pipelines.yml, which is kept for reference. That pipeline
# runs on a self-hosted Windows agent, so it only runs when that machine is on
# and its results never reach a GitHub pull request -- which is how a broken
# test survived a day in #40.
#
# Job order is by cost, cheapest first: lint fails in seconds, tests in a
# minute, images take several. There is no point building an image for code
# that does not lint.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# One run per ref. Pushing 3 times to a PR should not leave three runs
# competing for runners -- but a run on main or on a tag is NOT cancelled,
# because cancelling a publish halfway is how a registry ends up with a tag
# pointing at a partial push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege at the top, widened per job where needed. The default token
# is writable; a workflow that only reads code should say so, because a 
# compromised dependency in a test run inherits whatever this grants.
permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/*/requirements-dev.txt

      # The pin is read FROM requirements-dev.txt rather than repeated here.
      # A version written in two places drifts, and the failure mode is CI
      # passing on a rule set your machine does not have -- or the reverse,
      # which is worse because it looks like your code is wrong.
      - name: Install ruff at the pinned version
        run: grep '^ruff==' services/api/requirements-dev.txt | xargs pip install

      - run: ruff check services/

  test-api:
    name: api tests (Postgres)
    runs-on: ubuntu-latest
    # A hung test should cost ten mins of runner time, not the six-hour
    # default. The number is a smoke alarm, not a performance target.
    timeout-minutes: 15

    # Native on Linux runners. Azure pipelines does this with a manual
    # 'docker run', a 'for /l' polling loop and a cleanup step conditioned on
    # always() -- all of which exist only because the agent is Windows, where
    # service containers are unavailable.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kai
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: kai_test
        ports:
          - 5432:5432
        # health check IS the wait loop. The job does not start a step
        # until this passes, so there is no race and nothing to poll.
        #
        # -U kai, not -U kai_test: -U takes a ROLE. The Azure pipeline passes
        # the database name there and still reports ready, beacuse pg_isready
        # tests whether the server accepts connections and never authenticates
        # -- a check that cannot fail is not a check.
        options: >-
          --health-cmd "pg_isready -U kai -d kai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r services/api/requirements-dev.txt

      - name: pyest
        working-directory: services/api
        env:
          # 127.0.0.1, never localhost. On these runners localhost resolves to
          # ::1 first, and the service container's port is published on IPv4
          # only -- so the connection fails at the address, not the database.
          TEST_DATABASE_URL: postgresql://kai:testpw@127.0.0.1:5432/kai_test
          SECRET_KEY: ci-only
          API_TOKEN_SECRET: ci-only
        run: |
          pytest --junitxml=junit-api.xml \
                 --cov=app --cov-report=xml:coverage-api.xml --cov-report=term

      # if: always() -- a failed run is exactly when you want the report.
      # Conditioning artefacts on success uploads them only when nobody needs
      # them.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: |
            services/api/junit-api.xml
            services/api/coverage-api.xml

  test-web:
    name: web tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/web/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r services/web/requirements-dev.txt

      # No database and no service container. web owns no data -- it calls the
      # api -- so its tests stub the api client.
      - name: pytest
        working-directory: services/web
        env:
          SECRET_KEY: ci-only
        run: pytest --junitxml=junit-web.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results
          path: services/web/junit-web.xml

  validate-terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: fmt
        # -check fails rather than rewriting. CI that silently reformats your
        # code is CI you stop reading.
        run: terraform fmt -check -recursive

      - name: init (no backend)
        # Downloads providers and modules -- validate cannot run without them
        # -- while touching no remote state and needing no Azure credentials.
        # This is the line versions.tf was written to make possible.
        run: terraform init -backend=false

      - name: validate
        run: terraform validate

  validate-helm:
    name: helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHART: deploy/helm/kai-konane
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          # Matches the local v4.0.5. Helm 3 and Helm 4 differ in template
          # behaviour; a chart that renders on one and not the other is a
          # difference you want CI to surface, not absorb.
          version: v4.0.5

      - name: lint (default values)
        run: helm lint $CHART

      - name: lint (production values)
        run: helm lint $CHART -f $CHART/values-prod.yaml

      # lint parses. template RENDERS -- which is where a missing `---` inside
      # a range, or a required that fires when it should not, actually shows
      # up. #37 lost two of three Services to exactly that and lint was green.
      - name: render (default values)
        run: helm template kai-konane $CHART > /tmp/render-default.yaml

      - name: render (production values)
        # values-prod.yaml is deliberately incomplete -- two values are
        # supplied at install time, and the `required` guards exist to stop a
        # half-configured production release. The placeholders are obviously
        # fake on purpose: .invalid is a reserved TLD (RFC 2606) that can never
        # resolve, so nobody can mistake this output for something deployable.
        # The step checks that the TEMPLATES render, not that this renders a
        # working deployment.
        run: |
          helm template kai-konane $CHART \
            -f $CHART/values-prod.yaml \
            --set ingress.host=ci.invalid \
            --set externalDatabase.host=db.ci.invalid \
            > /tmp/render-prod.yaml

      # A NEGATIVE test. Every other step here asserts something works; this
      # asserts something FAILS. The ai.apiKey guard was added in #40 and
      # confirmed by watching it fire once, by hand -- this is what keeps it
      # confirmed after someone refactors the Secret template.
      - name: the ai.apiKey guard must fire
        run: |
          if helm template kai-konane $CHART \
               --set ai.provider=azure \
               --set ai.endpoint=https://example.openai.azure.com \
               > /dev/null 2>&1; then
            echo "::error::helm rendered with ai.provider=azure and no ai.apiKey; the required guard is gone"
            exit 1
          fi
          echo "guard fired as expected"

  validate-manifests:
    name: manifests and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # The rules live inside a ConfigMap, so promtool cannot read the file
      # directly -- it has to be lifted out of .data first.
      - name: Extract alerts.yml from the ConfigMap
        run: |
          python -c "
          import yaml 
          doc = yaml.safe_load(open('deploy/k8s/monitoring/11-prometheus-config.yaml'))
          open('/tmp/alerts.yml', 'w').write(doc['data']['alerts.yml'])
          "

      - name: promtool check rules
        run: |
          docker run --rm --entrypoint=/bin/promtool -v /tmp:/w \
            prom/prometheus:v2.54.1 check rules /w/alerts.yml

      # Schema validation for the raw manifests: catches a mistyped field or a
      # wrong apiVersion, which kubectl only reports when you apply.
      #
      # cluster/ is excluded on purpose -- kind-cluster.yaml is a kind config
      # and ingress-nginx-patch.yaml is a patch fragment. Neither is a
      # Kubernetes object and neither has a schema to check against.
      - name: Kubeconform (raw manifests)
        # A DIRECTORY, not a glob. `/w/deploy/k8s/*.yaml` is expanded by the
        # runner's shell, where /w does not exist -- so it matches nothing,
        # passes through literally, and kubeconform (which does not glob) is
        # handed a path with an asterisk in it. Handing it the directory lets
        # it walk the tree itself, monitoring/ included.
        #
        # cluster/ is excluded because kind-cluster.yaml is a kind config and
        # ingress-nginx-patch.yaml is a patch fragment. Neither is a Kubernetes
        # object, so neither has a schema to validate against.
        run: |
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas \
            -ignore-filename-pattern 'cluster/' \
            /w/deploy/k8s

  images:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # THIS is where "cheapest first" earns its keep. Six jobs run in parallel
    # for about a minute; only then does anything spend runner time on three
    # docker builds. Nothing here builds an image for code that does not lint,
    # does not pass, or renders a chart that will not apply.
    needs: [lint, test-api, test-web, validate-terraform, validate-helm, validate-manifests]

    permissions:
      contents: read
      # Write access to GHCR. Granted at the JOB, not the workflow -- the test
      # jobs run third party code from requirements files, and a token that can
      # publish images should not be sitting in that environment.
      packages: write
      # For the provenance attestation below.
      id-token: write
      attestations: write

    strategy:
      # One broken Dockerfile should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: services/api
          - name: web
            context: services/web
          - name: gateway
            context: gateway

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only on a tag -- there is nothing to log in for otherwise, and a
      # registry credential that exists on every pull-request run is a
      # credential available to every pull request.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/naughlan-creator/kai-konane-2/${{ matrix.name }}
          # Same names the Azure pipeline publishes, so nothing that already
          # pulls these images has to change.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # Builds on every PR, pushes on none of them. The build IS the test:
          # #38 broke three times on dependency compilation alone -- pandas,
          # alembic, mysqlclient -- and once on a missing `apk add curl`. Every
          # one of those was found by building, not by any test.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache shared across runs, so an unchanged requirements.txt
          # does not recompile psycopg2 on every pull request.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}

      # Signed, verifiable provenance: which workflow, at which commit, built
      # this exact digest. `docker pull` cannot tell you that, and "the image
      # in the registry matches the source" is otherwise an act of faith.
      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/naughlan-creator/kai-konane-2/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

